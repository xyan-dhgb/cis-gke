name: Deploy Autopilot Google Kubernetes Engine with Terraform and Github Actions

on:
  push:
    branches:
      - master
    paths:
      - 'gcp-gke-infr/autopilot/**'
      - '.github/workflows/deploy-gke-autopilot.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

env:
  TERRAFORM_VERSION: '1.6.0'
  WORKING_DIR: 'gcp-gke-infr/autopilot'
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

concurrency:
  group: terraform-gke-autopilot
  cancel-in-progress: false

jobs:
  terraform:
    name: 'Terraform ${{ github.event.inputs.action || ''apply'' }}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          export_environment_variables: true

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set GCP project
        run: |
          gcloud config set project $GCP_PROJECT_ID

      - name: Debug GCP context
        run: |
          gcloud auth list
          gcloud config list

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="region=${{ secrets.GCP_REGION }}" \
            -var="cluster_name=${{ secrets.GKE_AUTOPILOT_CLUSTER_NAME }}" \
            -var="network=${{ secrets.GKE_AUTOPILOT_NETWORK }}" \
            -var="subnetwork=${{ secrets.GKE_AUTOPILOT_SUBNETWORK }}" \
            -var="released_channel=REGULAR" \
            -no-color \
            -out=tfplan
        continue-on-error: false

      - name: Terraform Apply
        id: apply
        if: |
          (github.ref == 'refs/heads/master' && github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: terraform apply -auto-approve tfplan

      - name: Get GKE Autopilot Cluster Info
        if: steps.apply.outcome == 'success'
        run: |
          echo "========================================"
          echo "GKE Autopilot Cluster Deployed Successfully!"
          echo "========================================"
          echo ""
          echo "Terraform Outputs:"
          terraform output
