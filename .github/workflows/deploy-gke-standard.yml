name: Deploy Standard Google Kubernetes Engine with Terraform and Github Actions

on:
  push:
    branches:
      - master
    paths:
      - 'gcp-gke-infr/standard/**'
      - '.github/workflows/deploy-gke-standard.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

env:
  TERRAFORM_VERSION: '1.6.0'
  WORKING_DIR: 'gcp-gke-infr/standard'
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  terraform:
    name: 'Terraform ${{ github.event.inputs.action || ''apply'' }}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    
    env:
      GOOGLE_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.GCS_BACKEND_BUCKET }}" \
            -backend-config="prefix=terraform/state"

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -no-color \
            -out=tfplan
        continue-on-error: false

      - name: Terraform Apply
        id: apply
        if: |
          (github.ref == 'refs/heads/master' && github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: |
          terraform apply \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -auto-approve \
            tfplan

      - name: Get GKE Cluster Info
        if: steps.apply.outcome == 'success'
        run: |
          echo "==================================="
          echo "GKE Cluster Deployed Successfully!"
          echo "==================================="
          echo ""
          echo "Terraform Outputs:"
          terraform output
